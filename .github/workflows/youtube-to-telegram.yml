name: YouTube Link to Telegram

on:
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'

jobs:
  send-link:
    runs-on: ubuntu-latest
    steps:
      - name: Install yt-dlp
        run: python3 -m pip install --user --break-system-packages -U yt-dlp

      - name: Get latest video link
        run: |
          set -euo pipefail
          yt-dlp --flat-playlist --playlist-end 1 --print webpage_url \
            'https://www.youtube.com/@myanmar3dfree003/videos' > /tmp/video_url.txt
          URL=$(head -n 1 /tmp/video_url.txt)
          test -n "$URL" || { echo 'No YouTube video found'; exit 1; }
          echo "VIDEO_URL=$URL" >> "$GITHUB_ENV"

      - name: Send link to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN" || { echo 'TELEGRAM_BOT_TOKEN secret is missing'; exit 1; }
          curl --fail --show-error \
            -X POST \
            -d "chat_id=@happydayfor" \
            --data-urlencode "text=📺 New video: $VIDEO_URL" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
